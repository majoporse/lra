# LRA server-side filter mode
#
# Selects which mechanism manages LRA lifecycles on the server side:
# - false (default): the legacy JAX-RS ServerLRAFilter, which processes the MicroProfile
#   @LRA annotations on JAX-RS resources.
# - true: the CDI interceptor, which processes the transport-neutral @LRATransaction
#   annotations on plain CDI beans. Bean participants (classes with @LRATransaction plus
#   @LRACompensate/@LRAAfterLRA callbacks) are discovered and enlisted only in this mode.
#
# Applications that adopt the interceptor path can override this in their own
# application.properties (an application config source takes precedence over this file).
lra.server.filter.interceptor=false

# Base URI bean participants advertise to the LRA coordinator for their callback URIs
# ({base}/lra-participant-proxy/{ClassName}/{compensate|complete|status|forget|after}).
# It mirrors the lra.coordinator.url property: a deployment setting, never derived from the
# request. When the interceptor mode is enabled and a bean participant is discovered without
# this property, the application fails to start, because the coordinator could never call the
# participant back.
# narayana.lra.base-uri=http://localhost:8080/