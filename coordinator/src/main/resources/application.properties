# SmallRye Reactive Messaging Kafka configuration for LRA Coordinator

# Incoming channel (requests from clients)
mp.messaging.incoming.lra-request.connector=smallrye-kafka
mp.messaging.incoming.lra-request.enabled=${quarkus.lra.kafka.enabled:false}
mp.messaging.incoming.lra-request.topic=${quarkus.lra.coordinator-topic:lra-request}
mp.messaging.incoming.lra-request.auto.offset.reset=earliest

# Outgoing channel (replies to clients)
mp.messaging.outgoing.lra-reply.connector=smallrye-kafka
mp.messaging.outgoing.lra-reply.enabled=${quarkus.lra.kafka.enabled:false}
mp.messaging.outgoing.lra-reply.topic=lra-reply
mp.messaging.outgoing.lra-reply.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Outgoing channel (participant callbacks - the per-message topic is set by the Kafka transport)
mp.messaging.outgoing.lra-callback.connector=smallrye-kafka
mp.messaging.outgoing.lra-callback.enabled=${quarkus.lra.kafka.enabled:false}
mp.messaging.outgoing.lra-callback.topic=lra-callback
mp.messaging.outgoing.lra-callback.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Incoming channel (replies to participant callbacks)
mp.messaging.incoming.lra-callback-reply.connector=smallrye-kafka
mp.messaging.incoming.lra-callback-reply.enabled=${quarkus.lra.kafka.enabled:false}
mp.messaging.incoming.lra-callback-reply.topic=${quarkus.lra.coordinator-callback-topic:lra-callback-reply}
mp.messaging.incoming.lra-callback-reply.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
