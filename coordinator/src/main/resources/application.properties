# SmallRye Reactive Messaging Kafka configuration for LRA Coordinator

# Incoming channels (requests from clients)
mp.messaging.incoming.lra-start.connector=smallrye-kafka
mp.messaging.incoming.lra-start.enabled=${lra.kafka.enabled:false}
mp.messaging.incoming.lra-start.topic=lra-start
mp.messaging.incoming.lra-start.auto.offset.reset=earliest

mp.messaging.incoming.lra-close.connector=smallrye-kafka
mp.messaging.incoming.lra-close.enabled=${lra.kafka.enabled:false}
mp.messaging.incoming.lra-close.topic=lra-close
mp.messaging.incoming.lra-close.auto.offset.reset=earliest

mp.messaging.incoming.lra-cancel.connector=smallrye-kafka
mp.messaging.incoming.lra-cancel.enabled=${lra.kafka.enabled:false}
mp.messaging.incoming.lra-cancel.topic=lra-cancel
mp.messaging.incoming.lra-cancel.auto.offset.reset=earliest

mp.messaging.incoming.lra-leave.connector=smallrye-kafka
mp.messaging.incoming.lra-leave.enabled=${lra.kafka.enabled:false}
mp.messaging.incoming.lra-leave.topic=lra-leave
mp.messaging.incoming.lra-leave.auto.offset.reset=earliest

mp.messaging.incoming.lra-join.connector=smallrye-kafka
mp.messaging.incoming.lra-join.enabled=${lra.kafka.enabled:false}
mp.messaging.incoming.lra-join.topic=lra-join
mp.messaging.incoming.lra-join.auto.offset.reset=earliest

mp.messaging.incoming.lra-status.connector=smallrye-kafka
mp.messaging.incoming.lra-status.enabled=${lra.kafka.enabled:false}
mp.messaging.incoming.lra-status.topic=lra-status
mp.messaging.incoming.lra-status.auto.offset.reset=earliest

# Outgoing channel (replies to clients)
mp.messaging.outgoing.lra-reply.connector=smallrye-kafka
mp.messaging.outgoing.lra-reply.enabled=${lra.kafka.enabled:false}
mp.messaging.outgoing.lra-reply.topic=lra-reply
mp.messaging.outgoing.lra-reply.value.serializer=org.apache.kafka.common.serialization.StringSerializer

lra.kafka.enabled=false