# SmallRye Reactive Messaging Kafka configuration for LRA Coordinator

# Incoming channel (requests from clients and callback replies from participants)
mp.messaging.incoming.lra-request.connector=smallrye-kafka
mp.messaging.incoming.lra-request.enabled=${quarkus.lra.client.protocol.kafka:false}
mp.messaging.incoming.lra-request.topic=${quarkus.lra.coordinator-topic:lra-request}
mp.messaging.incoming.lra-request.auto.offset.reset=earliest
# KafkaLRAListener is @Blocking(ordered = false) so that callback replies sharing
# this topic with client requests can be processed while a request is blocked.

# Outgoing channel (replies to clients and participant callbacks). The destination topic is set
# per message, so it is not configured here.
mp.messaging.outgoing.lra-outbound.connector=smallrye-kafka
mp.messaging.outgoing.lra-outbound.enabled=${quarkus.lra.client.protocol.kafka:false}
mp.messaging.outgoing.lra-outbound.value.serializer=org.apache.kafka.common.serialization.StringSerializer
