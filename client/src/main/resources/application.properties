# SmallRye Reactive Messaging Kafka configuration for LRA Client

# Outgoing channels (requests to coordinator)
mp.messaging.outgoing.lra-start.connector=smallrye-kafka
mp.messaging.outgoing.lra-start.topic=lra-start
mp.messaging.outgoing.lra-start.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.lra-close.connector=smallrye-kafka
mp.messaging.outgoing.lra-close.topic=lra-close
mp.messaging.outgoing.lra-close.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.lra-cancel.connector=smallrye-kafka
mp.messaging.outgoing.lra-cancel.topic=lra-cancel
mp.messaging.outgoing.lra-cancel.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.lra-leave.connector=smallrye-kafka
mp.messaging.outgoing.lra-leave.topic=lra-leave
mp.messaging.outgoing.lra-leave.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.lra-join.connector=smallrye-kafka
mp.messaging.outgoing.lra-join.topic=lra-join
mp.messaging.outgoing.lra-join.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.lra-status.connector=smallrye-kafka
mp.messaging.outgoing.lra-status.topic=lra-status
mp.messaging.outgoing.lra-status.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Reply topic is handled by raw Kafka consumer (per-instance topic)
# See KafkaLRAClient constructor for configuration
