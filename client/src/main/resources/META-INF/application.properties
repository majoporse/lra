# SmallRye Reactive Messaging Kafka configuration for LRA Client

# Outgoing channel (requests to coordinator)
mp.messaging.outgoing.lra-request.connector=smallrye-kafka
mp.messaging.outgoing.lra-request.enabled=${quarkus.lra.client.protocol.kafka:false}
mp.messaging.outgoing.lra-request.topic=${quarkus.lra.coordinator-topic:lra-request}

# The service's single topic carries both coordinator replies and participant callbacks.
# KafkaInboundListener distinguishes them by the presence of an envelope "type".
mp.messaging.incoming.lra-reply.connector=smallrye-kafka
mp.messaging.incoming.lra-reply.enabled=${quarkus.lra.client.protocol.kafka:false}
mp.messaging.incoming.lra-reply.topic=${quarkus.lra.client-topic:lra-reply-default}
mp.messaging.incoming.lra-reply.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# KafkaInboundListener is @Blocking(ordered = false) so that a callback handler
# waiting for a coordinator reply on this same topic cannot stall that reply.

quarkus.lra.client.protocol=http
